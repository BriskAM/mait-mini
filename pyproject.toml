[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traffic-sign-recognition"
version = "0.1.0"
description = "GTSRB traffic-sign classification with TensorFlow/Keras"
requires-python = ">=3.11,<3.13"
dependencies = [
  "tensorflow==2.16.2",
  "opencv-python-headless==4.12.0.88",
  "numpy==2.2.6",
  "pandas==2.3.2",
  "matplotlib==3.10.6",
  "scikit-learn==1.7.2",
  "Pillow==11.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

